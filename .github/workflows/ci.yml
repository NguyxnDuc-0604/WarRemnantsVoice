name: Continuous Integration (CI)

# Kích hoạt khi có commit push hoặc PR vào nhánh main, dev
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  # Job 1: Kiểm tra tính hợp lệ của file docker-compose
  validate-infra:
    name: Check Docker Compose Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra cấu hình Docker Compose
        run: docker compose config

  # Job 2: Kiểm thử các Service Node.js (Gateway / Exhibit)
  test-node-services:
    name: Test Node.js Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chạy kiểm thử nếu service đã có package.json
      - name: Run Exhibit Service Test
        run: |
          if [ -f "services/exhibit-service/package.json" ]; then
            cd services/exhibit-service
            npm install
            npm test --if-present
          else
            echo "Chưa có package.json trong exhibit-service, bỏ qua test."
          fi

  # Job 3: Kiểm thử AI Pipeline Service (Python)
  test-python-ai:
    name: Test Python AI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện và chạy test
        run: |
          if [ -f "services/ai-pipeline-service/requirements.txt" ]; then
            cd services/ai-pipeline-service
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pytest --maxfail=1 --disable-warnings -q || echo "Chưa có file test pytest."
          else
            echo "Chưa có requirements.txt, bỏ qua."
          fi
