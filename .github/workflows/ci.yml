name: Continuous Integration (CI)

# Kích hoạt khi có commit push hoặc PR vào nhánh main, dev
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  # Job 1: Kiểm tra tính hợp lệ của file docker-compose
  validate-infra:
    name: Check Docker Compose Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra cấu hình Docker Compose
        run: docker compose config

  # Job 2: Kiểm thử các Service Node.js (Gateway / Exhibit / Frontend)
  test-node-services:
    name: Test Node.js & Frontend Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test Frontend Build
        run: |
          if [ -f "services/frontend/package.json" ]; then
            cd services/frontend
            npm install
            npm run build
          fi

  # Job 3: Kiểm thử AI Pipeline Service (Python) - Thành viên 2
  test-python-ai:
    name: Test Python AI Pipeline & Database Separation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt thư viện AI Pipeline
        run: |
          cd services/ai-pipeline-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy Unit Tests AI Pipeline (pytest)
        run: |
          cd services/ai-pipeline-service
          pytest -v --disable-warnings
