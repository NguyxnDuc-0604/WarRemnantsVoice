services:
  # =====================================================
  # 1. API GATEWAY (Port 8000) - Điểm tiếp nhận duy nhất
  # =====================================================
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: museum_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - EXHIBIT_SERVICE_URL=http://exhibit-service:8001
      - ANALYTICS_SERVICE_URL=http://analytics-service:8002
      - AI_SERVICE_URL=http://ai-pipeline-service:8003
      - STREAMING_SERVICE_URL=http://streaming-service:8004
    depends_on:
      - exhibit-service
      - analytics-service
      - ai-pipeline-service
      - streaming-service

  # =====================================================
  # 2. EXHIBIT CORE SERVICE (Port 8001)
  # =====================================================
  exhibit-service:
    build:
      context: ./services/exhibit-service
      dockerfile: Dockerfile
    container_name: museum_exhibit_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - AI_SERVICE_URL=http://ai-pipeline-service:8003
      - EXHIBIT_DATABASE_URL=postgresql+psycopg2://postgres:password123@postgres:5432/museum_db
    depends_on:
      postgres:
        condition: service_healthy

  # =====================================================
  # 3. ANALYTICS & MONITORING SERVICE (Port 8002)
  # =====================================================
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: museum_analytics_service
    restart: always
    ports:
      - "8002:8002"
    environment:
      - ANALYTICS_DATABASE_URL=postgresql+psycopg2://postgres:password123@postgres:5432/museum_db
    depends_on:
      postgres:
        condition: service_healthy

  # =====================================================
  # 4. AI PIPELINE SERVICE (Port 8003)
  # =====================================================
  ai-pipeline-service:
    build:
      context: ./services/ai-pipeline-service
      dockerfile: Dockerfile
    container_name: museum_ai_service
    restart: always
    ports:
      - "8003:8003"
    environment:
      - MEDIA_DIR=/app/output
    volumes:
      - ./services/ai-pipeline-service/output:/app/output
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # =====================================================
  # 5. STREAMING & MEDIA SERVICE (Port 8004)
  # =====================================================
  streaming-service:
    build:
      context: ./services/streaming-service
      dockerfile: Dockerfile
    container_name: museum_streaming_service
    restart: always
    ports:
      - "8004:8004"
    environment:
      - MEDIA_DIR=/app/output
    volumes:
      - ./services/ai-pipeline-service/output:/app/output

  # =====================================================
  # 6. FRONTEND (Port 5173) - React Single Page Application
  # =====================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: museum_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://gateway-service:8000
    depends_on:
      - gateway-service

  # =====================================================
  # 7. HẠ TẦNG CƠ SỞ (Database, Broker, Object Storage)
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: museum_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: museum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init_database.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d museum_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: museum_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: museum_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
  media-data:
